name: Sync verified Harness Lab publication
on:
  push:
    branches: [main]
    paths:
      - publication-manifest.json
      - scripts/sync-publication.py
      - .github/workflows/sync-publication.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: harness-lab-publication-sync
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Test publication source validation
        run: python3 -m unittest discover -s tests -p 'test_sync_publication.py'
      - name: Verify and mirror the master publication
        run: python3 scripts/sync-publication.py
